<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案C2 色のある版画</title>
<link rel="stylesheet" href="fonts/shippori-mincho/500.css">
<link rel="stylesheet" href="fonts/shippori-mincho/700.css">
<style>
  :root { --paper: #EDE6D3; --ink: #1E1B22; --shu: #C8452D; --soft: #6B665B; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Shippori Mincho', serif; }
  .page { display: grid; grid-template-columns: 1fr auto; gap: 32px; padding: 32px 40px; height: 100vh; box-sizing: border-box; }
  .plate { position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .title { writing-mode: vertical-rl; font-size: 36px; font-weight: 700; line-height: 1.6; letter-spacing: 0.08em; margin: 0; max-height: 640px; }
  .title small { font-size: 16px; font-weight: 500; color: var(--soft); letter-spacing: 0.02em; margin-left: 12px; }
  .line { position: absolute; left: 0; bottom: 0; max-width: 26em; background: var(--paper); padding: 14px 20px 4px 0; font-size: 20px; line-height: 1.8; }
  .line b { display: block; font-size: 15px; color: var(--soft); }
  .moods { position: absolute; right: 0; bottom: 0; display: flex; gap: 6px; font-family: inherit; }
  .moods button { font: 500 15px 'Shippori Mincho', serif; background: transparent; border: 0; padding: 6px 10px; cursor: pointer; color: var(--soft); }
  .moods button[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
  @media (max-width: 700px) {
    .page { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 20px 16px; gap: 8px; }
    .title { writing-mode: horizontal-tb; font-size: 24px; }
    .title small { display: block; margin: 4px 0 0; }
    .line { font-size: 16px; bottom: 44px; }
  }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div class="page">
  <div class="plate">
    <canvas id="c"></canvas>
    <p class="line" id="line"></p>
    <div class="moods" id="moods"></div>
  </div>
  <h1 class="title">誰の人生の記録を、最後の一段に収めますか。<small>記録庫の最後の棚　四人が待っている</small></h1>
</div>
<script type="module">
import * as THREE from 'three';
import { buildRoom, isoCamera } from './scene3d.js';
import { colorDither } from './post.js';

const PALETTE = ['#EDE6D3', '#1E1B22', '#2C3E66', '#3F7A78', '#9DB08A', '#D9A441', '#C8452D', '#D98C86', '#6B4A6E', '#9EC1CF', '#7A5236'];
const MOODS = {
  calm:    { label: '穏やか', who: 2, text: '港の朝は、毎日少しずつ違うんです。', u: { tension: 0, sorrow: 0, warmth: 0.2, hope: 0 }, scale: 2 },
  tension: { label: '張りつめ', who: 3, text: '娘の学費のことを考えると、ここで選ばれないわけにはいかないんです。', u: { tension: 1, sorrow: 0, warmth: 0, hope: 0 }, scale: 2 },
  sorrow:  { label: '悲しみ', who: 1, text: '妻を見送ってから、町の古い地名を覚えているのは私だけになりました。', u: { tension: 0, sorrow: 1, warmth: 0, hope: 0 }, scale: 3 },
  hope:    { label: '希望', who: 0, text: 'いつか、学校に行けない子が昼間にいられる場所を開きたいんです。', u: { tension: 0, sorrow: 0, warmth: 0.6, hope: 1 }, scale: 2 },
};
const NAMES = ['春日 灯', '大槻 文雄', '森 由真', '渡瀬 透'];

const pal = {
  base: '#5B4A3B', floor: '#C8A47A', floorLine: '#9A7650', wall: '#A8BDB4', wall2: '#86A09A', window: '#FBE7BC',
  wood: '#7E5638', books: ['#8E3B2E', '#2F4F7A', '#C99A3E', '#4E6B47', '#9B5A8A', '#D8C9A6', '#3A3550'],
  slot: '#FF2010', paper: '#F3EBDD', ink: '#2B2622', lampShade: '#E9D7A9', lampGlow: '#FFC769', lampEmissive: 1.0,
  lampLight: '#FFC46B', lampIntensity: 5, skin: '#EBD3B8', hair: ['#2E2620', '#B8B8B2', '#3A2E25', '#4A3A2A'],
  people: ['#D0614A', '#4C7FB8', '#E0B13E', '#8E62A6'],
};

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#EDE6D3');
const { root, figures, slot } = buildRoom(pal);
slot.material.color.set('#C8452D');
scene.add(root);
figures.forEach((f) => f.traverse((o) => {
  if (o.isMesh && !o.userData.hull) {
    const h = new THREE.Mesh(o.geometry, new THREE.MeshBasicMaterial({ color: '#1E1B22', side: THREE.BackSide }));
    h.scale.setScalar(1.1); h.userData.hull = true; o.add(h);
  }
}));
scene.add(new THREE.HemisphereLight('#FFF4E0', '#6A5A4A', 1.3));
const sun = new THREE.DirectionalLight('#FFE2B8', 2.4);
sun.position.set(-9, 9, 5); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun);

let cam, fx;
function size() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  const a = w / h;
  cam = isoCamera(a, a < 1 ? 3.4 / a : 4.7);
  cam.position.set(14, 11, 14); cam.lookAt(-0.2, 0.8, 0.6);
  fx = colorDither(renderer, w, h, PALETTE);
}
size(); addEventListener('resize', size);

const params = new URLSearchParams(location.search);
let mood = params.get('mood') in MOODS ? params.get('mood') : 'calm';
const cur = { tension: 0, sorrow: 0, warmth: 0, hope: 0 };
Object.assign(cur, MOODS[mood].u);
const moodsEl = document.getElementById('moods');
moodsEl.innerHTML = Object.entries(MOODS).map(([k, m]) => `<button data-m="${k}">${m.label}</button>`).join('');
function setMood(k) {
  mood = k;
  moodsEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === k));
  const m = MOODS[k];
  document.getElementById('line').innerHTML = `<b>${NAMES[m.who]}</b>${m.text}`;
}
moodsEl.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMood(b.dataset.m); });
addEventListener('keydown', (e) => { const k = Object.keys(MOODS)[+e.key - 1]; if (k) setMood(k); });
setMood(mood);

let t0 = performance.now();
(function loop(now) {
  const t = (now - t0) / 1000;
  const m = MOODS[mood];
  for (const k in cur) cur[k] += (m.u[k] - cur[k]) * 0.06;
  figures.forEach((f, i) => { f.position.y = 0.06 + (i === m.who ? Math.abs(Math.sin(t * (mood === 'tension' ? 9 : 3))) * 0.05 : 0); });
  const p = figures[m.who].position.clone().add(new THREE.Vector3(0, 0.9, 0)).project(cam);
  const u = fx.uniforms;
  u.focus.value.set((p.x + 1) / 2, (p.y + 1) / 2);
  u.time.value = t;
  for (const k in cur) u[k].value = cur[k];
  fx.render(scene, cam, m.scale);
  requestAnimationFrame(loop);
})(t0);
</script>
</body>
</html>
