<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案A ミニチュア</title>
<link rel="stylesheet" href="fonts/zen-maru-gothic/500.css">
<link rel="stylesheet" href="fonts/zen-maru-gothic/700.css">
<style>
  :root { --table: #2A2622; --paper: #F1E9DA; --ink: #2F2A25; --amber: #F2C46B; --muted: #B7AC9B; }
  html, body { margin: 0; height: 100%; background: var(--table); color: var(--paper); font-family: 'Zen Maru Gothic', sans-serif; }
  .stage { position: relative; height: 100vh; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .q { position: absolute; left: 40px; top: 32px; max-width: 22em; }
  @media (max-width: 600px) { .q { left: 16px; right: 16px; top: 20px; } .q h1 { font-size: 24px; } .bubble { font-size: 14px; } }
  .q small { display: block; color: var(--muted); font-size: 15px; margin-bottom: 6px; }
  .q h1 { word-break: auto-phrase; text-wrap: balance; margin: 0; font-size: 34px; line-height: 1.4; font-weight: 700; }
  .bubble { position: absolute; background: var(--paper); color: var(--ink); border-radius: 18px; padding: 14px 18px; max-width: 15em; font-size: 16px; line-height: 1.7; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .bubble b { display: block; font-size: 13px; color: #8A7A66; margin-bottom: 2px; }
  .bubble::after { content: ''; position: absolute; left: 34px; bottom: -10px; border: 10px solid transparent; border-top-color: var(--paper); border-bottom: 0; }
  .bubble.ask { background: var(--amber); }
  .bubble.ask::after { border-top-color: var(--amber); }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="q"><small>記録庫の最後の棚　4人が待っている</small><h1>誰の人生の記録を、最後の一段に収めますか。</h1></div>
  <div class="bubble ask" id="b1"><b>記録係</b>写真を撮りはじめたのは、どうしてですか。</div>
  <div class="bubble" id="b2"><b>森 由真</b>港がなくなる前に、毎朝そこで働く人の顔を残しておきたかったんです。</div>
</div>
<script type="module">
import * as THREE from 'three';
import { buildRoom, isoCamera } from './scene3d.js';
import { tiltShift } from './post.js';

const pal = {
  base: '#5B4A3B', floor: '#C8A47A', floorLine: '#B48F66', wall: '#9FAEA6', wall2: '#8C9B94', window: '#FBE7BC',
  wood: '#86603F', books: ['#7E4E3A', '#3F5D6E', '#A7854F', '#5E6B47', '#9B5A4A', '#D8C9A6', '#46404A'],
  slot: '#FFD585', paper: '#F3EBDD', ink: '#2B2622', lampShade: '#E9D7A9', lampGlow: '#FFC769', lampEmissive: 1.2,
  lampLight: '#FFC46B', lampIntensity: 6, skin: '#EBD3B8', hair: ['#2E2620', '#9A9A96', '#3A2E25', '#4A3A2A'],
};

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#2A2622');
const { root, slot, figures } = buildRoom(pal);
scene.add(root);
// 夕方の窓から差す光と、部屋のやわらかい回り込み
scene.add(new THREE.HemisphereLight('#FFF1DC', '#5A4636', 1.1));
const sun = new THREE.DirectionalLight('#FFD9A8', 2.4);
sun.position.set(-9, 8, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6; sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun);
// 空き枠から漏れる光
const glow = new THREE.PointLight('#FFC861', 5, 3.5, 1.5);
glow.position.copy(slot.getWorldPosition(new THREE.Vector3())).add(new THREE.Vector3(0, 0, 0.6));
scene.add(glow);

let cam, post;
function size() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  cam = isoCamera(w / h, w / h < 1 ? 4.2 / (w / h) : 5.6);
  cam.position.set(14, 11, 14); cam.lookAt(0.3, 0.6, 0.2);
  post = tiltShift(renderer, w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
}
size(); addEventListener('resize', size);

// 吹き出しを人と机の上に置く
const toScreen = (v) => { const p = v.clone().project(cam); return [(p.x + 1) / 2 * canvas.clientWidth, (1 - p.y) / 2 * canvas.clientHeight]; };
const clampX = (el, x) => Math.max(12, Math.min(x, canvas.clientWidth - el.offsetWidth - 12));
function place() {
  const t = toScreen(figures[2].position.clone().add(new THREE.Vector3(0, 1.6, 0)));
  const b2 = document.getElementById('b2'); b2.style.left = clampX(b2, t[0] - 60) + 'px'; b2.style.top = (t[1] - b2.offsetHeight - 14) + 'px';
  const d = toScreen(new THREE.Vector3(3.4, 2.0, 0.6));
  const b1 = document.getElementById('b1'); b1.style.left = clampX(b1, d[0] - 30) + 'px'; b1.style.top = (d[1] - b1.offsetHeight - 14) + 'px';
}
let t0 = performance.now();
function loop(now) {
  const t = (now - t0) / 1000;
  // 話している人だけ、少し弾む
  figures[2].position.y = 0.06 + Math.abs(Math.sin(t * 3)) * 0.04;
  glow.intensity = 4.5 + Math.sin(t * 1.3) * 0.6;
  post(scene, cam); place();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
